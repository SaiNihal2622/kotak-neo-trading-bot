# Kotak Neo Trading Bot — Production config
# All values can be overridden by env vars (uppercase, KOTAK_ prefix not used here)
mode: paper  # 'paper' or 'live'

broker:
  type: paper            # 'paper' or 'neo' (real Kotak Neo)
  environment: uat       # 'uat' or 'prod'
  paper_capital: 100000  # PAPER account size (user said: let paper trading size be 100000)
  # live_capital: 300000  # actual capital if/when flipping to live
  # PaperClient fill simulation (no hardcodes in code):
  limit_fill_spread_pct: 0.1      # 0.1% spread for LIMIT order fill simulation
  limit_fill_min_spread: 0.05    # min Rs.0.05 spread (NSE tick)
  limit_fill_near_ltp_pct: 0.5    # fill LIMIT if within 0.5% of LTP
  # Fill mode for paper:
  #   'market_like'      : force fill at LTP +/- slippage (paper validation of strategy logic) - DEFAULT
  #   'aggressive_limit' : fill if within 5% of LTP, else defer (close to live)
  #   'realistic_limit'  : original logic - only fill if limit crosses synthetic bid/ask
  fill_mode: market_like

# =============================================================
# MARKET HOURS — NSE standard. All time thresholds live here.
# Override only if NSE changes schedule (rare). NO hardcodes in code.
# =============================================================
market_hours:
  pre_open_start: "09:00"
  pre_open_end:   "09:15"
  opening_end:    "09:30"
  regular_end:    "15:00"
  close:          "15:30"
  square_off:     "15:15"

# =============================================================
# VARIABLE RISK ENGINE — adapts to regime, confidence, and recent performance
# =============================================================
risk:
  # base caps (low-confidence / range regime)
  base:
    max_loss_per_trade_pct: 1.0     # 1% of capital
    max_loss_per_trade_abs: 1500    # Rs 1,500 hard cap
    max_daily_loss_pct: 3.0
    max_daily_loss_abs: 3000
    max_trades_per_day: 6
    max_weekly_loss_pct: 6.0
    max_monthly_loss_pct: 12.0
    max_consecutive_losses: 4
    default_lots: 1
    max_lots: 3
    per_underlying_cap: 0.30
  # aggressive caps (high-confidence / trending regime, recent wins)
  aggressive:
    max_loss_per_trade_pct: 2.0
    max_loss_per_trade_abs: 2000
    max_daily_loss_pct: 5.0
    max_daily_loss_abs: 5000
    max_trades_per_day: 10
    default_lots: 1
    max_lots: 4
  # defensive caps (low-confidence / volatile regime, recent losses)
  defensive:
    max_loss_per_trade_pct: 0.5
    max_loss_per_trade_abs: 500
    max_daily_loss_pct: 1.5
    max_daily_loss_abs: 1500
    max_trades_per_day: 3
    default_lots: 1
    max_lots: 1
  # timing
  square_off_time: "15:15"
  no_new_trades_after: "14:30"
  # =============================================================
  # INTRADAY-ONLY MODE — prevents overnight gap risk
  # When allow_overnight=false, no new entries after no_new_trades_after
  # and all positions force-square-off by force_square_off_time
  # =============================================================
  intraday:
    allow_overnight: false           # MASTER SWITCH: false = intraday only
    no_new_trades_after: "13:30"     # block new entries this IST time
    force_square_off_time: "14:30"   # hard close all positions by this IST time
    avoid_first_5_min_after_open: true  # don't trade 9:15-9:30 (let price settle)
    event_blackout_min_before: 60    # no trades within 60 min BEFORE macro event
    event_blackout_min_after: 15     # no trades within 15 min AFTER macro event
  # =============================================================
  # VIX-AWARE POSITION SIZING — scales lot count down as volatility rises
  # =============================================================
  vix:
    fetch_symbol: "^INDIAVIX"
    refresh_minutes: 15
    thresholds:
      calm_max: 15.0                 # VIX <= 15 → 1.0x lots
      elevated_max: 18.0             # VIX 15-18 → 0.75x
      high_max: 22.0                 # VIX 18-22 → 0.5x
      # VIX > 22 → no trades
    skip_above: 22.0                 # hard skip threshold
    refresh_on_startup: true
  # kill switches
  kill_on_data_stale_min: 5
  kill_on_news_shock: true
  # adaptation
  adapt_to_regime: true              # regime → preset
  adapt_to_performance: true         # win/loss streak → preset
  high_confidence_threshold: 0.7     # ≥ this → aggressive
  low_confidence_threshold: 0.45     # < this → defensive
  # position cap (STRATEGY count, NOT leg count — e.g. 1 iron condor = 1
  # strategy even though it has 4 legs). Bug fixed 2026-08-20; legacy
  # code used `max(len(open_trades), len(open_pos))` which counted legs
  # and blocked the bot after 1 multi-leg strategy.
  position_cap: 2                    # 1 NIFTY + 1 BANKNIFTY max (strategy count)
  cooldown_per_symbol_sec: 600       # 10 min between trades on same symbol
  min_hold_before_smart_exit_sec: 300  # 5 min minimum hold before smart exit can fire
  # Phantom 0DTE auto-purge (FIX 2026-08-20). When the bot restarts, the
  # broker may still report positions in 0DTE contracts that expired at
  # 15:30 of the previous session. These phantoms block new signals
  # because the cap check sees 6 leftover "positions" instead of 0.
  # Set to false ONLY for forensic debugging.
  purge_phantom_0dte_on_startup: true
  # Hourly P&L snapshot to Telegram
  hourly_pnl_report: true
  hourly_pnl_report_minute: 0        # top of each hour
  # ----- Execution resilience (Phase 1.3) -----
  # Wraps broker.place_order with retry/backoff + cancel-replace on stale orders
  # + fallback to alternative data feeds when primary fails.
  execution:
    retry:
      enabled: true
      max_attempts: 3
      backoff_sec: [1.0, 2.0, 4.0]    # one per attempt
      retryable_errors: ["timeout", "network", "rate limit", "5xx", "session expired"]
    cancel_replace:
      enabled: true
      stale_after_sec: 60             # consider OPEN >60s as stale
      move_threshold_pct: 0.5         # LTP must have moved >0.5% from order price
      max_replaces_per_order: 1       # don't replace the same order more than once
      price_adjust_pct: 0.1           # new price = LTP +/- 0.1% toward market
    fallback_data:
      enabled: true
      primary: "kotak_prod"
      fallbacks: ["dhan", "yfinance"]  # tried in order on primary failure
  # ----- Margin tracking (Phase 1.4) -----
  margin:
    enabled: true
    refresh_sec: 30                    # how often to fetch fresh margin
    alert_levels_pct: [50, 70, 90]     # when to alert (utilization %)
    alert_cooldown_hours: 4            # min hours between re-alerts at the same level
    min_free_margin_pct: 10            # block new trades if free margin < 10%
    pre_trade_buffer_pct: 5            # require 5% headroom on top of trade cost

  # =============================================================
  # SMART EXIT THRESHOLDS — no hardcodes in code, all configurable
  # =============================================================
  smart_exit:
    target_pct: 0.95                # exit when pnl >= 95% of plan.target
    stop_pct: 0.95                  # exit when -pnl >= 95% of plan.stop
    min_hold_pnl_pct: 0.5           # time-decay exit if pnl < 50% of target
    expiry_minutes_threshold: 30    # "close to expiry" = within N min
    max_hold_multiplier: 1.5        # max-hold exit if hold > 1.5x expected
    max_hold_pnl_pct: 0.7           # max-hold exit requires pnl < 70% target
    iv_crush_pct: -20.0             # IV drop % triggering exit on long premium
    iv_crush_pnl_pct: 0.3           # IV-crush exit requires pnl < 30% target
    partial_profit_low: 0.5         # partial take at >= 50% of target
    partial_profit_high: 0.95       # and < 95% of target
    partial_profit_hold_pct: 0.3    # only after 30% of expected hold
    regime_flip_pnl_pct: 0.3        # regime-flip exit if pnl < 30% target

  # Strike selection
  strike_padding: 4                  # strikes around ATM (e.g. 4 = ATM ±4 = 9 strikes)
  # Bracket order parameters (live trading — paper uses these too for parity)
  bracket:
    sl_pct: 0.5         # SL = entry * 0.5 (50% of premium for long options)
    target_mult: 1.5    # target = entry * 1.5 (50% above entry)
    trail_pct: 0.1      # trailing SL trail = entry * 0.1
  # Index tokens (NSE standard)
  index_tokens:
    NIFTY: "26000"
    BANKNIFTY: "26009"
  # Synthetic feed base (paper mode only)
  synthetic:
    nifty_base: 24500.0
    banknifty_base: 52000.0
    nifty_sigma: 0.16
    banknifty_sigma: 0.20
    tick_interval_sec: 0.5

instruments:
  enabled: [NIFTY, BANKNIFTY]
  lot_sizes:
    NIFTY: 65               # Updated 2026-08-11 from PROD scrip master (was 75)
    BANKNIFTY: 30
  strike_step:
    NIFTY: 50
    BANKNIFTY: 100
  expiry_preference: weekly          # 'weekly' (current week) or 'next_weekly'

# =============================================================
# STRATEGIES — all 10 enabled, regime-driven selection
# =============================================================
strategy:
  regime_detector:
    adx_trending_threshold: 25
    adx_range_threshold: 20
    vix_low: 12
    vix_high: 18
    iv_rank_low: 30
    iv_rank_high: 70
    lookback_bars: 96

  # 1. Iron condor — range, defined risk
  iron_condor:
    enabled: true
    wing_width: 100
    short_delta: 0.16
    profit_target_pct: 50
    stop_loss_multiplier: 2.0
    regime_preference: range
  # 2. Short strangle — range, high IV, undefined risk
  short_strangle:
    enabled: true
    short_delta: 0.20
    profit_target_pct: 50
    stop_loss_multiplier: 2.0
    regime_preference: range
  # 3. Iron butterfly — range, ATM-anchored, high prob
  iron_butterfly:
    enabled: true
    profit_target_pct: 50
    stop_loss_multiplier: 1.5
    regime_preference: range
  # 4. Jade lizard — high IV, short put + short call spread
  jade_lizard:
    enabled: true
    profit_target_pct: 50
    stop_loss_multiplier: 1.5
    regime_preference: range
  # 5. Bull call vertical — trending up, defined risk
  bull_call_vertical:
    enabled: true
    wing_width: 100
    target_rr: 2.0
    regime_preference: trending_up
  # 6. Bear put vertical — trending down, defined risk
  bear_put_vertical:
    enabled: true
    wing_width: 100
    target_rr: 2.0
    regime_preference: trending_down
  # 7. Long call (single leg) — strong uptrend, momentum
  long_call:
    enabled: true
    target_rr: 2.0
    regime_preference: trending_up
  # 8. Long put (single leg) — strong downtrend
  long_put:
    enabled: true
    target_rr: 2.0
    regime_preference: trending_down
  # 9. Calendar spread — range, time decay edge
  calendar:
    enabled: true
    profit_target_pct: 40
    stop_loss_multiplier: 1.5
    regime_preference: range
  # 10. Long straddle — event play / volatile / pre-news
  long_straddle:
    enabled: true
    target_rr: 1.5
    stop_loss_multiplier: 1.0
    regime_preference: volatile
  # Event straddle — pre-RBI/Fed/expiry
  event_straddle:
    enabled: true
    straddle_pre_event:
      entry_minutes_before: 30
      exit_at_event: true
    events_calendar:
      - rbi_policy
      - us_fed
      - union_budget
      - gdp_release
      - monthly_expiry
  # Min confidence threshold for any strategy
  min_confidence: 0.40
  # Allow single-leg directional trades via bracket
  allow_single_leg_bracket: true

# =============================================================
# DATA — live India feed (yfinance spot + BS options) is the default
# =============================================================
data:
  historical_source: yfinance       # 'yfinance' (free), 'nselib', 'truedata', 'dhan'
  truedata_api_key: ""
  nselib_cache: data_cache/nselib
  # Feed modes:
  #   'live_kotak'  — REAL NSE option prices from Kotak Neo PROD via REST polling.
  #                   Real bid/ask depth, ltp, oi. ~2s latency. Recommended for paper trading.
  #   'live_india'  — REAL NIFTY/BANKNIFTY spot from yfinance + Black-Scholes option pricing
  #                   using real India VIX. Option prices are theoretical (no bid/ask depth).
  #   'synthetic'   — random walk (kept for unit tests / offline)
  #   'live_uat'    — Kotak Neo UAT websocket (UAT has no real market data — limited)
  live_feed: live_kotak
  live_uat_fallback_sec: 30
  resample_intervals: [1, 5, 15, 60]
  news:
    fetch_interval_sec: 300
    sources:
      - moneycontrol
      - economic_times
      - livemint
      - business_standard
      - ndtv_profit
    finbert_model: Vansh180/FinBERT-India-v1
    llm_judge:
      enabled: true
      provider: minimax              # 'minimax' (M2.7-highspeed) or 'anthropic'
      model: MiniMax-M2.7-highspeed
      base_url_env: MINIMAX_LLM_BASE_URL
      api_key_env: MINIMAX_LLM_API_KEY
      rate_limit_per_min: 30         # stay under TPM cap

# =============================================================
# ALERTS
# =============================================================
alerts:
  telegram:
    enabled: true
    bot_token_env: TELEGRAM_BOT_TOKEN
    chat_id_env: TELEGRAM_CHAT_ID
  email:
    enabled: true
    smtp_host: smtp.gmail.com
    smtp_port: 587
    user_env: ALERT_EMAIL_USER
    password_env: ALERT_EMAIL_PASSWORD
    to_env: ALERT_EMAIL_TO
  voice:
    enabled: true                   # synthesize MP3 on every fill
    on_fill: true
    on_eod: true
    on_anomaly: true
  visual_report:
    enabled: true                   # generate Plotly chart daily
    at_eod: true

backtest:
  default_period_days: 180
  walk_forward_splits: 5
  initial_capital: 100000
  commission_per_order: 20
  slippage_bps: 5

logging:
  level: INFO
  file: logs/bot.log
  trade_log: logs/trades.csv
  signal_log: logs/signals.csv
  audit_log: data_cache/audit_log.jsonl
