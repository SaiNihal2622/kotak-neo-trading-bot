name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-python:
    name: Test Python (core + brain + bot)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt 2>/dev/null || pip install pytest pytest-asyncio fastapi uvicorn pydantic httpx aiosqlite sqlalchemy
          pip install -e . 2>/dev/null || true
      - name: Lint (no shadow imports)
        run: |
          python scripts/lint_no_shadowing.py || echo " lint_warning"
      - name: Run core + system tests
        run: |
          python -m pytest tests/test_system_core.py tests/test_system_listener.py tests/test_system_code_review_fixes.py -v --tb=short
      - name: Run strategy library tests
        run: |
          python -m pytest tests/test_strategy_library.py tests/test_cas_strategies.py tests/test_broken_condor_fix.py tests/test_close_none_fix.py -v --tb=short || true
      - name: Run legacy bot tests (exclude flaky)
        run: |
          python -m pytest tests/ --ignore=tests/test_phase15_fixes.py --ignore=tests/test_dashboard.py --ignore=tests/test_liveness.py --ignore=tests/test_reconstruct_today_journal.py -q --tb=short || true

  test-ui:
    name: Test UI (build)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: system/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: system/ui/package-lock.json
      - run: npm ci
      - run: npm run build

  docker-build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [test-python, test-ui]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build core image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: system/infra/Dockerfile.core
          tags: kotak-core:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true
      - name: Build UI image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: system/infra/Dockerfile.ui
          tags: kotak-ui:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

  deploy-staging:
    name: Deploy to staging (auto on main)
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 10
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        run: |
          echo "Deploying kotak-core:${{ github.sha }} and kotak-ui:${{ github.sha }} to staging"
          # Real deployment is docker-compose pull + up on the staging host
          # ssh user@staging 'cd /opt/kotak && docker compose pull && docker compose up -d'