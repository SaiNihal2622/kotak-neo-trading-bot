global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: kotak-paper

scrape_configs:
  - job_name: kotak-core
    static_configs:
      - targets: ["core:8510"]
    metrics_path: "/api/metrics"

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]