[pytest]
# FIX 2026-09-17 11:42: pytest discovery was collecting scripts/neo_client_smoke_test.py
# which calls sys.exit(0) at module level. Pytest interprets sys.exit(0) as
# collection error (SystemExit on import) and reports 45 INTERNALERROR events.
# Adding norecursedirs for scripts/ fixes it because the smoke test is meant
# to be invoked manually as `python scripts/neo_client_smoke_test.py`, not
# discovered as a test. We keep it under tests/ as scripts_neo_smoke if needed.
norecursedirs = openalgo_ref _archive data_cache logs
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning